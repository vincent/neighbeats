name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # cgo is needed for the ONNX Runtime binding (loaded at run time, so no
      # libonnxruntime is required to build). ffmpeg is used by some tests.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: go build ./...
      - run: go test -race -count=1 ./...
