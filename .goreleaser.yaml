version: 2

project_name: neighbeats

before:
  hooks:
    # Downloads the ONNX Runtime libraries bundled into the Debian packages.
    - ./packaging/fetch-ort.sh

builds:
  - id: neighbeats
    binary: neighbeats
    main: ./cmd/neighbeats
    # cgo is needed for the ONNX Runtime binding (the library itself is loaded
    # at run time). arm64 is cross-built with gcc-aarch64-linux-gnu on the
    # release runner; see .github/workflows/release.yml.
    env:
      - CGO_ENABLED=1
      - CC={{ if eq .Arch "arm64" }}aarch64-linux-gnu-gcc{{ else }}gcc{{ end }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1
    goarm64:
      - v8.0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: ["tar.gz"]
    wrap_in_directory: true
    files:
      - LICENSE
      - README.md
      - config.example.yaml
      - docs/operations.md

nfpms:
  - id: neighbeats
    package_name: neighbeats
    formats: [deb]
    maintainer: Vincent Lark <vincent.lark@gmail.com>
    description: Playlists that travel from one song to another, built from your own library.
    homepage: https://github.com/vincent/neighbeats
    license: Apache-2.0
    section: sound
    priority: optional
    dependencies:
      - ffmpeg
      - libc6 (>= 2.35)
      - libstdc++6
      - libgcc-s1
    contents:
      # CPU build of ONNX Runtime (MIT), see packaging/fetch-ort.sh.
      - src: packaging/ort/{{ .Arch }}/libonnxruntime.so
        dst: /usr/lib/neighbeats/libonnxruntime.so
        file_info: {mode: 0644}
      - src: packaging/ort/{{ .Arch }}/libonnxruntime_providers_shared.so
        dst: /usr/lib/neighbeats/libonnxruntime_providers_shared.so
        file_info: {mode: 0644}
      - src: packaging/ort/{{ .Arch }}/LICENSE
        dst: /usr/share/doc/neighbeats/onnxruntime-LICENSE
      - src: packaging/ort/{{ .Arch }}/ThirdPartyNotices.txt
        dst: /usr/share/doc/neighbeats/onnxruntime-ThirdPartyNotices.txt
      - src: packaging/config.yaml
        dst: /etc/neighbeats/config.yaml
        type: config|noreplace
      - src: packaging/neighbeats-update.service
        dst: /lib/systemd/system/neighbeats-update.service
      - src: packaging/neighbeats-update.timer
        dst: /lib/systemd/system/neighbeats-update.timer
      - src: packaging/neighbeats-serve.service
        dst: /lib/systemd/system/neighbeats-serve.service
      - src: config.example.yaml
        dst: /usr/share/doc/neighbeats/config.example.yaml
      - src: docs/operations.md
        dst: /usr/share/doc/neighbeats/operations.md
      - src: docs/api.md
        dst: /usr/share/doc/neighbeats/api.md
      - src: README.md
        dst: /usr/share/doc/neighbeats/README.md
      - src: LICENSE
        dst: /usr/share/doc/neighbeats/copyright
    scripts:
      postinstall: packaging/postinstall.sh
      postremove: packaging/postremove.sh

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - '^docs?:'
      - '^test:'
      - '^chore:'

release:
  footer: |
    `.deb` (amd64, arm64, CPU only): `sudo apt install ./neighbeats_*.deb`, it bundles ONNX Runtime
    and needs `ffmpeg`; see docs/operations.md. The tar.gz binary needs `libonnxruntime.so`
    (ONNX Runtime 1.29) and `ffmpeg` on the host, plus the model files. Docker images:
    `ghcr.io/{{ .Env.GITHUB_REPOSITORY }}:{{ .Version }}` (CUDA) and `:{{ .Version }}-cpu`.
