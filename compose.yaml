# neighbeats on a Docker host. This is the CUDA image: enable the `deploy` block at the
# bottom if the host has an NVIDIA GPU and the NVIDIA container toolkit; with no GPU use
# compose.cpu.yaml as well (smaller, amd64 and arm64).
#
# One-time setup:
#   cp config.example.yaml config.yaml            # then edit path_map
#   mkdir -p data models                          # put the ONNX model in ./models
#   export MUSIC_DIR=/path/to/your/music          # or put it in a .env file
#
# Or let it ask: `docker compose run --rm -it neighbeats onboard` (the config file
# must exist first, see above; it downloads the models and sets the GPU choice).
#
# Run commands (the entrypoint is `neighbeats`):
#   docker compose run --rm neighbeats scan
#   docker compose run --rm neighbeats analyze -limit 20   # quick GPU check
#   docker compose run --rm neighbeats analyze
#   docker compose run --rm neighbeats stats
#
# Without a GPU, drop the `deploy` block or run with `-provider cpu`; with
# `provider: auto` (the default) a missing GPU falls back to the CPU anyway.

# The image is the published one; NEIGHBEATS_TAG picks the version (main, 1.2.3, ...).
# To build it from this checkout instead, add compose.build.yaml.
services:
  neighbeats:
    image: ghcr.io/vincent/neighbeats:${NEIGHBEATS_TAG:-main}
    environment:
      NEIGHBEATS_CONFIG: /config/config.yaml
      # Jellyfin API key for sync-jellyfin; put it in .env, never in config.yaml.
      NEIGHBEATS_JELLYFIN_KEY: ${NEIGHBEATS_JELLYFIN_KEY:-}
    volumes:
      # Writable only so `onboard` can set path_map.remote and provider and
      # download the models; every other command only reads them.
      - ./config.yaml:/config/config.yaml
      - ./data:/data
      - ./models:/models
      # Read-only; the container path must match music_roots in the config.
      - type: bind
        source: ${MUSIC_DIR:?set MUSIC_DIR to the folder that holds your music}
        target: /music
        read_only: true
    # Files in ./data belong to you, not to root. Override in .env if your
    # ids differ (`id -u`, `id -g`).
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Long-running API for media-server plugins (docs/api.md): `mkdir run` once, then
  # `docker compose up -d neighbeats-serve`. The socket appears in ./run; mount that
  # folder into the Jellyfin container too (e.g. `- /path/to/neighbeats/run:/run/neighbeats`)
  # and run Jellyfin with the same PGID so it may open the socket (mode 0660).
  # It reloads the index by itself after `update`; no GPU needed.
  neighbeats-serve:
    image: ghcr.io/vincent/neighbeats:${NEIGHBEATS_TAG:-main}
    command: serve
    restart: unless-stopped
    environment:
      NEIGHBEATS_CONFIG: /config/config.yaml
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./data:/data
      - ./models:/models:ro
      - ./run:/run/neighbeats
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
