# Build the image from this checkout instead of pulling the published one:
#
#   docker compose -f compose.yaml -f compose.build.yaml build
#   NEIGHBEATS_DOCKERFILE=Dockerfile.cpu docker compose -f compose.yaml -f compose.cpu.yaml -f compose.build.yaml build

services:
  neighbeats:
    build:
      context: .
      dockerfile: ${NEIGHBEATS_DOCKERFILE:-Dockerfile}
