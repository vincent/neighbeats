# Override for hosts without an NVIDIA GPU: the smaller CPU image (amd64, arm64).
#
#   docker compose -f compose.yaml -f compose.cpu.yaml run --rm -it neighbeats onboard
#
# or set COMPOSE_FILE=compose.yaml:compose.cpu.yaml in .env to make it the default.
# Use `provider: cpu` in config.yaml. To build it locally: compose.build.yaml too, with
# NEIGHBEATS_DOCKERFILE=Dockerfile.cpu.

services:
  neighbeats:
    image: ghcr.io/vincent/neighbeats:${NEIGHBEATS_TAG:-main}-cpu
